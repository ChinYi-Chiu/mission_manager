<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作日誌系統 - 備份與還原版</title>
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. React 與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 3. Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 模擬 Lucide 圖示組件
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('worklog_tasks');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [dailyLogs, setDailyLogs] = useState(() => {
                const saved = localStorage.getItem('worklog_dailylogs');
                return saved ? JSON.parse(saved) : {};
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingTask, setEditingTask] = useState(null);
            const [newTask, setNewTask] = useState({
                name: '', content: '', startDate: new Date().toISOString().split('T')[0],
                deadline: '', priority: '普通', progress: 0
            });

            const [todayReport, setTodayReport] = useState('');
            const [todayNote, setTodayNote] = useState('');
            const fileInputRef = useRef(null);

            const priorities = {
                '緊急': { level: 4, color: 'text-red-600', bg: 'bg-red-100' },
                '盡快完成': { level: 3, color: 'text-orange-600', bg: 'bg-orange-100' },
                '普通': { level: 2, color: 'text-blue-600', bg: 'bg-blue-100' },
                '長期': { level: 1, color: 'text-gray-600', bg: 'bg-gray-100' }
            };

            useEffect(() => { localStorage.setItem('worklog_tasks', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('worklog_dailylogs', JSON.stringify(dailyLogs)); }, [dailyLogs]);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [isModalOpen, tasks, dailyLogs, editingTask]);

            // --- 導出與匯入功能 ---
            const exportData = () => {
                const data = {
                    tasks,
                    dailyLogs,
                    version: "1.0",
                    exportAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `worklog_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (imported.tasks && imported.dailyLogs) {
                            if (confirm('匯入備份將會覆蓋目前的資料，確定要繼續嗎？')) {
                                setTasks(imported.tasks);
                                setDailyLogs(imported.dailyLogs);
                                alert('還原成功！');
                            }
                        } else {
                            alert('無效的備份檔案格式。');
                        }
                    } catch (err) {
                        alert('檔案讀取失敗。');
                    }
                };
                reader.readAsText(file);
                // 重置 input 以便下次選擇同一檔案
                event.target.value = null;
            };

            // --- 任務操作 ---
            const handleOpenAddModal = () => {
                setEditingTask(null);
                setNewTask({
                    name: '', content: '', startDate: new Date().toISOString().split('T')[0],
                    deadline: '', priority: '普通', progress: 0
                });
                setIsModalOpen(true);
            };

            const handleOpenEditModal = (task) => {
                setEditingTask(task);
                setNewTask({ ...task });
                setIsModalOpen(true);
            };

            const handleSaveTask = (e) => {
                e.preventDefault();
                if (!newTask.name) return;

                if (editingTask) {
                    setTasks(prev => prev.map(t => t.id === editingTask.id ? { ...newTask } : t));
                } else {
                    const taskWithId = { 
                        ...newTask, id: Date.now(), 
                        createdAt: new Date().toISOString().split('T')[0],
                        history: [{ date: new Date().toISOString().split('T')[0], progress: 0 }] 
                    };
                    setTasks([...tasks, taskWithId]);
                }
                setIsModalOpen(false);
            };

            const updateProgress = (taskId, newProgress) => {
                const today = new Date().toISOString().split('T')[0];
                const val = Math.min(100, Math.max(0, parseInt(newProgress) || 0));
                setTasks(prev => prev.map(task => {
                    if (task.id === taskId) {
                        const otherHistory = task.history ? task.history.filter(h => h.date !== today) : [];
                        return { ...task, progress: val, history: [...otherHistory, { date: today, progress: val }] };
                    }
                    return task;
                }));
            };

            const saveDailyReport = () => {
                const today = new Date().toISOString().split('T')[0];
                setDailyLogs(prev => ({
                    ...prev,
                    [today]: {
                        report: todayReport, note: todayNote,
                        taskSnapshot: tasks.map(t => ({ id: t.id, name: t.name, progress: t.progress, createdAt: t.createdAt }))
                    }
                }));
                setTodayReport(''); setTodayNote('');
                alert('今日數據已儲存！');
            };

            const deleteTask = (id) => { if (confirm('確定刪除此任務嗎？')) setTasks(tasks.filter(t => t.id !== id)); };

            const sortedTasks = useMemo(() => {
                return [...tasks].sort((a, b) => {
                    if (priorities[b.priority].level !== priorities[a.priority].level) return priorities[b.priority].level - priorities[a.priority].level;
                    if (!a.deadline) return 1; if (!b.deadline) return -1;
                    return new Date(a.deadline) - new Date(b.deadline);
                });
            }, [tasks]);

            const sortedLogDates = useMemo(() => Object.keys(dailyLogs).sort((a, b) => new Date(b) - new Date(a)), [dailyLogs]);

            const getProgressDiff = (currentTask, logDate) => {
                const dateObj = new Date(logDate);
                dateObj.setDate(dateObj.getDate() - 1);
                const prevDateStr = dateObj.toISOString().split('T')[0];
                if (currentTask.createdAt === logDate) return { diff: currentTask.progress, isNew: true };
                const prevLog = dailyLogs[prevDateStr];
                if (prevLog) {
                    const prevTask = prevLog.taskSnapshot.find(t => t.id === currentTask.id);
                    if (prevTask) return { diff: currentTask.progress - prevTask.progress, isNew: false };
                }
                return { diff: 0, isNew: false };
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                            <div>
                                <div className="flex items-center gap-4">
                                    <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-2">
                                        <Icon name="clipboard-list" className="text-indigo-600" /> 工作日誌系統
                                    </h1>
                                    <div className="flex items-center gap-1 border-l pl-4 border-slate-200">
                                        <button onClick={exportData} title="導出備份檔案" className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-white rounded-full transition-all">
                                            <Icon name="download" size={18} />
                                        </button>
                                        <button onClick={() => fileInputRef.current.click()} title="匯入備份檔案" className="p-2 text-slate-400 hover:text-green-600 hover:bg-white rounded-full transition-all">
                                            <Icon name="upload" size={18} />
                                        </button>
                                        <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                                    </div>
                                </div>
                                <p className="text-slate-500 mt-1 text-sm font-medium">資料安全提醒：建議定期點擊下載圖示備份資料。</p>
                            </div>
                            <button onClick={handleOpenAddModal} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-2 transition-all active:scale-95">
                                <Icon name="plus" size={18} /> 新增任務
                            </button>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div className="lg:col-span-3 space-y-6">
                                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-5 border-b bg-slate-50 flex justify-between items-center">
                                        <h2 className="font-bold flex items-center gap-2">
                                            <Icon name="clock" size={18} className="text-indigo-500" /> 當前任務
                                        </h2>
                                    </div>
                                    <div className="divide-y">
                                        {sortedTasks.length === 0 ? <div className="p-10 text-center text-slate-400 italic">目前無任務</div> : 
                                            sortedTasks.map(task => (
                                            <div key={task.id} className="p-6 hover:bg-slate-50 transition-colors group">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="space-y-2 flex-1">
                                                        <div className="flex items-center gap-2">
                                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${priorities[task.priority].bg} ${priorities[task.priority].color}`}>
                                                                {task.priority}
                                                            </span>
                                                            <span className={`font-bold text-slate-900 ${task.progress === 100 ? 'line-through text-slate-400' : ''}`}>
                                                                {task.name}
                                                            </span>
                                                        </div>
                                                        {/* 任務詳細描述展示區 */}
                                                        {task.content && (
                                                            <div className="text-sm text-slate-600 whitespace-pre-wrap bg-slate-50 p-3 rounded-lg border-l-4 border-slate-200 italic">
                                                                {task.content}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex gap-2 ml-4 opacity-40 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => handleOpenEditModal(task)} className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg">
                                                            <Icon name="edit-3" size={16}/>
                                                        </button>
                                                        <button onClick={() => deleteTask(task.id)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg">
                                                            <Icon name="trash-2" size={16}/>
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col md:flex-row md:items-center gap-4 mt-4">
                                                    <div className="text-[11px] text-slate-500 flex gap-4 flex-1 font-medium">
                                                        <span className="flex items-center gap-1"><Icon name="calendar" size={12}/>起：{task.startDate}</span>
                                                        <span className={`flex items-center gap-1 ${task.deadline && new Date(task.deadline) < new Date() ? 'text-red-500 font-bold' : ''}`}>
                                                            <Icon name="alert-circle" size={12}/>止：{task.deadline || '未設定'}
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-3 min-w-[240px]">
                                                        <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                                                            <div className={`h-full transition-all duration-500 ${task.progress === 100 ? 'bg-green-500' : 'bg-indigo-500'}`} style={{width: `${task.progress}%`}}></div>
                                                        </div>
                                                        <div className="flex items-center gap-1">
                                                            <input 
                                                                type="number" 
                                                                value={task.progress} 
                                                                onChange={(e) => updateProgress(task.id, e.target.value)} 
                                                                className="w-10 text-right text-sm font-bold bg-transparent focus:outline-none"
                                                            />
                                                            <span className="text-xs text-slate-400">%</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-5 border-b bg-slate-50 flex items-center justify-between">
                                        <h2 className="font-bold flex items-center gap-2">
                                            <Icon name="history" size={18} className="text-indigo-500" /> 歷史日誌 (Log)
                                        </h2>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm border-collapse min-w-[700px]">
                                            <thead>
                                                <tr className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b">
                                                    <th className="px-6 py-4">日期</th>
                                                    <th className="px-6 py-4">未完成任務</th>
                                                    <th className="px-6 py-4">當日完成</th>
                                                    <th className="px-6 py-4">工作摘要</th>
                                                    <th className="px-6 py-4">備註</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {sortedLogDates.length === 0 ? (
                                                    <tr><td colSpan="5" className="px-6 py-10 text-center text-slate-400">尚無儲存紀錄</td></tr>
                                                ) : sortedLogDates.map(date => {
                                                    const log = dailyLogs[date];
                                                    const unfinished = log.taskSnapshot.filter(t => t.progress < 100);
                                                    const finished = log.taskSnapshot.filter(t => t.progress === 100);
                                                    return (
                                                        <tr key={date} className="align-top hover:bg-slate-50/50 transition-colors">
                                                            <td className="px-6 py-4 font-bold text-slate-900 whitespace-nowrap">{date}</td>
                                                            <td className="px-6 py-4 space-y-1">
                                                                {unfinished.length === 0 ? <span className="text-slate-300 italic text-xs">無</span> : unfinished.map(t => {
                                                                    const {diff, isNew} = getProgressDiff(t, date);
                                                                    return (
                                                                        <div key={t.id} className="text-slate-700 flex flex-wrap items-center gap-1">
                                                                            <span>• {t.name}</span>
                                                                            <span className="text-slate-400 text-[10px]">({t.progress}%)</span>
                                                                            {isNew && <span className="text-[10px] bg-green-100 text-green-700 px-1 rounded font-bold">新</span>}
                                                                            {diff > 0 && !isNew && <span className="text-[10px] text-blue-600 font-bold">+{diff}%</span>}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </td>
                                                            <td className="px-6 py-4 space-y-1">
                                                                {finished.length === 0 ? <span className="text-slate-300 italic text-xs">-</span> : finished.map(t => (
                                                                    <div key={t.id} className="text-green-600 flex items-center gap-1 font-medium">
                                                                        <Icon name="check-circle" size={12}/> {t.name}
                                                                    </div>
                                                                ))}
                                                            </td>
                                                            <td className="px-6 py-4 whitespace-pre-wrap text-slate-600 text-xs">{log.report || '-'}</td>
                                                            <td className="px-6 py-4 text-[11px] italic text-slate-400 whitespace-pre-wrap">{log.note || '-'}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </section>
                            </div>

                            <div className="lg:col-span-1">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 sticky top-8 shadow-sm">
                                    <h2 className="font-bold mb-4 flex items-center gap-2 text-indigo-900">
                                        <Icon name="check-circle-2" className="text-green-500" size={18}/> 今日工作快照
                                    </h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-500 block mb-1">今日摘要</label>
                                            <textarea 
                                                value={todayReport} 
                                                onChange={(e) => setTodayReport(e.target.value)} 
                                                className="w-full border border-slate-200 rounded-xl p-3 text-sm h-32 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" 
                                                placeholder="簡述今天完成的工作..."
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-bold text-slate-500 block mb-1">備註 / 明日計畫</label>
                                            <textarea 
                                                value={todayNote} 
                                                onChange={(e) => setTodayNote(e.target.value)} 
                                                className="w-full border border-slate-200 rounded-xl p-3 text-sm h-20 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" 
                                                placeholder="其他補充事項..."
                                            />
                                        </div>
                                        <button 
                                            onClick={saveDailyReport} 
                                            className="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-xl transition-all shadow-md active:scale-95"
                                        >
                                            儲存日報至歷史 Log
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {isModalOpen && (
                            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                                    <div className="p-6 border-b flex justify-between items-center bg-slate-50/50">
                                        <h3 className="font-bold text-xl text-slate-900">{editingTask ? '修改任務內容' : '建立全新任務'}</h3>
                                        <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors">
                                            <Icon name="x" size={20}/>
                                        </button>
                                    </div>
                                    <form onSubmit={handleSaveTask} className="p-6 space-y-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">任務名稱 *</label>
                                            <input 
                                                required type="text" placeholder="輸入任務標題" 
                                                value={newTask.name} 
                                                onChange={(e) => setNewTask({...newTask, name: e.target.value})} 
                                                className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">詳細描述</label>
                                            <textarea 
                                                placeholder="描述任務細節..." 
                                                value={newTask.content} 
                                                onChange={(e) => setNewTask({...newTask, content: e.target.value})} 
                                                className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm h-24 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">開始日期</label>
                                                <input 
                                                    type="date" value={newTask.startDate} 
                                                    onChange={(e) => setNewTask({...newTask, startDate: e.target.value})} 
                                                    className="w-full border border-slate-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-slate-700 mb-1">截止日期</label>
                                                <input 
                                                    type="date" value={newTask.deadline} 
                                                    onChange={(e) => setNewTask({...newTask, deadline: e.target.value})} 
                                                    className="w-full border border-slate-200 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">優先級</label>
                                            <select 
                                                value={newTask.priority} 
                                                onChange={(e) => setNewTask({...newTask, priority: e.target.value})} 
                                                className="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                            >
                                                {Object.keys(priorities).map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div className="pt-4 flex gap-3">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsModalOpen(false)}
                                                className="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 transition-all"
                                            >
                                                取消
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="flex-1 px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition-all shadow-lg active:scale-95"
                                            >
                                                {editingTask ? '儲存修改' : '確認建立'}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
