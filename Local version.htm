<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任務規劃工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .modal-animate-in { animation: modalFadeIn 0.2s ease-out; }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .status-overdue { color: #ef4444; } 
        .status-completed { color: #94a3b8; } 
        .status-ahead { color: #10b981; } 
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900">任務自動規劃系統</h1>
                <p id="today-info" class="text-sm text-slate-500 font-medium"></p>
            </div>
            <div class="flex gap-2">
                <button onclick="openConfig()" class="p-2.5 bg-white rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 transition">⚙️</button>
                <button onclick="createNewGoal()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-200 font-bold text-sm hover:bg-indigo-700 transition">+ 新目標</button>
                <button onclick="manualTaskVerification()" class="bg-green-500 text-white px-5 py-2.5 rounded-xl shadow-lg shadow-green-200 font-bold text-sm hover:bg-green-600 transition">手動核銷任務</button>
            </div>
        </header>

        <!-- 本週動態排程 -->
        <section class="mb-10">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    📅 本週排程建議 
                    <span class="bg-indigo-100 text-indigo-600 text-[10px] px-2 py-0.5 rounded-full">動態權重分配</span>
                </h2>
                <div id="today-budget-ui" class="text-[11px] font-bold text-slate-400"></div>
            </div>
            <div id="weekly-container" class="grid grid-cols-1 gap-4 md:grid-cols-7"></div>
        </section>

        <!-- 目標進度看板 -->
        <section>
            <h2 class="text-lg font-bold mb-4 text-slate-800">🏆 目標進度看板</h2>
            <div id="goals-grid" class="grid gap-4 sm:grid-cols-2"></div>
        </section>
    </div>

    <!-- 詳情 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-0 md:p-4">
        <div class="bg-white w-full h-full md:h-auto md:max-h-[90vh] md:max-w-3xl md:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-white sticky top-0 z-10">
                <div class="flex items-center gap-3">
                    <h3 id="detail-title" class="text-xl font-black text-slate-900">計畫詳情</h3>
                    <span id="detail-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">P5</span>
                </div>
                <div class="flex gap-2">
                    <button id="detail-edit-btn" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition">編輯計畫</button>
                    <button onclick="closeModals()" class="text-slate-300 text-3xl hover:text-slate-600 transition">&times;</button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scrollbar">
                <div id="detail-stats-grid" class="grid grid-cols-3 gap-4"></div>
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="font-bold text-slate-800">子任務執行狀態</h4>
                                <div class="flex items-center gap-2 text-[10px] text-slate-400">
                            <span>樹狀圖縮放(開發中)</span>
                            <input disabled id="detail-tree-scale" type="range" min="0.8" max="1.4" step="0.1" value="1" onchange="updateDetailTreeScale(this.value)" class="h-1 w-24 rounded-full bg-slate-200">
                            <button id="detail-tree-mode-btn" onclick="toggleDetailTreeMode()" class="text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg hover:bg-indigo-100 transition">水平樹</button>
                        </div>
                    </div>
                    <div id="detail-task-tree-wrapper" class="overflow-x-auto">
                        <div id="detail-task-tree" class="space-y-3" style="font-size:1rem;"></div>
                    </div>
                </div>
                <div class="border-t pt-6">
                    <h4 class="font-bold text-slate-800 mb-4">操作日誌 (Activity Logs)</h4>
                    <div id="detail-logs" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 編輯目標參數 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl modal-animate-in">
            <h3 class="text-lg font-black mb-6">編輯計畫參數</h3>
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">目標名稱</label>
                    <input type="text" id="edit-goal-title" class="w-full border-b-2 border-slate-100 py-2 font-bold outline-none focus:border-indigo-500 transition">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">優先級 (數字越大越重要)</label>
                        <input type="number" id="edit-goal-priority" min="1" max="5" class="w-full bg-slate-50 p-3 rounded-xl mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">權重 (%)</label>
                        <input type="number" id="edit-goal-weight" class="w-full bg-slate-50 p-3 rounded-xl mt-1 outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider">截止日期</label>
                    <input type="date" id="edit-goal-deadline" class="w-full bg-slate-50 p-3 rounded-xl mt-1 outline-none">
                </div>
                <div class="pt-4 border-t">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold text-slate-400">管理任務樹</span>
                        <button onclick="addRootTask()" class="text-indigo-600 text-xs font-bold bg-indigo-50 px-2 py-1 rounded-lg">+ 新增子任務</button>
                    </div>
                    <div id="tree-root" class="space-y-2 max-h-80 overflow-y-auto custom-scrollbar pr-2"></div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="deleteActiveGoal()" class="text-red-400 font-bold px-4 hover:text-red-600">刪除目標</button>
                    <button onclick="saveActiveGoal()" class="flex-1 bg-slate-900 text-white py-3.5 rounded-2xl font-bold shadow-lg">儲存變更</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定 Modal -->
    <div id="config-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 modal-animate-in">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">排程偏好設定</h3>
                <button onclick="closeModals()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">每日專注工時</label>
                        <input type="number" id="cfg-daily-hours" step="0.5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 ring-indigo-500/20">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">時區設定</label>
                        <select id="cfg-timezone" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 ring-indigo-500/20">
                            <option value="UTC">UTC (格林威治)</option>
                            <option value="Asia/Taipei">UTC+8 (台北/北京)</option>
                            <option value="Asia/Tokyo">UTC+9 (東京)</option>
                            <option value="America/New_York">UTC-5 (紐約)</option>
                            <option value="Europe/London">UTC+0 (倫敦)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">已排除休息日</label>
                    <div class="flex gap-2 mb-3">
                        <input type="date" id="cfg-off-date" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2 text-sm outline-none">
                        <button onclick="addOffDay()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold">新增</button>
                    </div>
                    <div id="off-days-tags" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1"></div>
                </div>
                <button onclick="saveConfig()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-indigo-100 mt-4">更新並重新規劃</button>
            </div>
        </div>
    </div>

    <!-- 核銷工時彈窗 -->
    <div id="log-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl modal-animate-in text-center">
            <h3 class="text-lg font-bold mb-1">工時核銷</h3>
            <p id="log-task-title" class="text-xs text-slate-400 mb-6 font-medium"></p>
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">本次完成時數 (h)</label>
                    <input type="number" id="log-hours-input" step="0.5" class="w-full text-center text-3xl font-black border-2 border-indigo-50 rounded-2xl p-4 outline-none focus:border-indigo-500 transition">
                </div>
                <button id="log-confirm-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-xl shadow-indigo-100">確認核銷</button>
                <button onclick="closeModals()" class="text-slate-400 text-sm font-bold">取消</button>
            </div>
        </div>
    </div>

    <!-- 手動核銷 Modal -->
    <div id="manual-log-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[75] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl modal-animate-in text-center">
            <h3 class="text-lg font-bold mb-1">手動核銷任務</h3>
            <div class="space-y-5 text-left">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">選擇計畫</label>
                    <select id="manual-goal-select" onchange="renderManualTaskOptions()" class="w-full bg-slate-50 p-3 rounded-2xl outline-none"></select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">選擇末端子任務</label>
                    <select id="manual-task-select" class="w-full bg-slate-50 p-3 rounded-2xl outline-none"></select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">本次完成時數 (h)</label>
                    <input type="number" id="manual-log-hours" step="0.5" class="w-full bg-slate-50 p-3 rounded-2xl text-center font-black outline-none" value="1">
                </div>
                <button onclick="confirmManualVerification()" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-xl shadow-green-100">確認核銷</button>
                <button onclick="closeModals()" class="text-slate-400 text-sm font-bold">取消</button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心狀態 ---
        let state = {
            goals: [],
            offDays: [],
            dailyMaxHours: 3,
            todayAvailableHours: 3, // 當日剩餘可用
            lastUpdateDate: "",     // 上次更新工時的日期
            timezone: "Asia/Taipei",
            lastId: 0
        };
        let activeGoalId = null;
        let isNewGoalEdit = false;
        let detailTreeScale = 1;
        let detailTreeMode = 'vertical';

        // --- 初始化 & 存取 ---
        window.onload = () => {
            const saved = localStorage.getItem('task_planner_v4_data_v5');
            if (saved) state = JSON.parse(saved);
            checkAndResetDailyHours();
            updateDateDisplay();
            refreshUI();
        };

        function persist() {
            localStorage.setItem('task_planner_v4_data_v5', JSON.stringify(state));
            refreshUI();
            if (activeGoalId) renderDetails(activeGoalId);
        }

        // 檢查是否跨日，若是則重置今日工時
        function checkAndResetDailyHours() {
            const todayStr = getTodayString();
            if (state.lastUpdateDate !== todayStr) {
                state.todayAvailableHours = state.dailyMaxHours;
                state.lastUpdateDate = todayStr;
                // 注意：這裡不主動 persist，交給後續操作
            }
        }

        function getTodayString() {
            const options = { timeZone: state.timezone, year: 'numeric', month: '2-digit', day: '2-digit' };
            const formatter = new Intl.DateTimeFormat('en-CA', options);
            return formatter.format(new Date());
        }

        function refreshUI() {
            renderGoalCards();
            renderWeeklyPlanner();
            renderOffDayTags();
            document.getElementById('cfg-daily-hours').value = state.dailyMaxHours;
            document.getElementById('cfg-timezone').value = state.timezone;
            document.getElementById('today-budget-ui').innerText = `今日可用餘額: ${state.todayAvailableHours.toFixed(1)}h / ${state.dailyMaxHours}h`;
        }

        function updateDateDisplay() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('zh-TW', { 
                timeZone: state.timezone, 
                month: 'long', day: 'numeric', weekday: 'long' 
            });
            document.getElementById('today-info').innerText = `${dateStr} (${state.timezone.split('/').pop()})`;// 每次更新日期顯示時也檢查是否需要重置工時
        }

        // --- 排程演算法 (修正為滾動調整當日分配) ---
        function calculateSchedule() {
            const todayStr = getTodayString();
            const planStates = state.goals.map(g => {
                const leaves = [];
                collectGoalLeaves(g, leaves, 0);
                const activeLeaves = leaves
                    .filter(t => !t.completed && (t.targetHours || 0) > (t.doneHours || 0))
                    .map((t, index) => ({ ...t, remaining: Math.max(0, (t.targetHours || 0) - (t.doneHours || 0)), treeIndex: index, parent: g.title }));
                return { goal: g, leaves: activeLeaves, priority: g.priority, weight: g.weight };
            }).filter(p => p.leaves.length > 0);

            const schedule = [];
            const availableToday = Math.max(0, state.todayAvailableHours);

            for (let i = 0; i < 7; i++) {
                const dStr = getOffsetDateString(i);
                if (state.offDays.includes(dStr)) continue;
                const isToday = (dStr === todayStr);
                const dayRemTotal = isToday ? availableToday : state.dailyMaxHours;
                const activePlans = planStates.filter(p => p.leaves.some(t => t.remaining > 0 && (!isToday || t.lastVerifiedDate !== todayStr)));
                if (activePlans.length === 0) break;

                if (dayRemTotal <= 0 && isToday) {
                    const topPlanTasks = selectPlans(activePlans).flatMap(p => p.leaves.filter(t => t.lastVerifiedDate !== todayStr).slice(0, 3));
                    topPlanTasks.forEach(task => {
                        schedule.push({ date: dStr, taskId: task.id, title: task.title, parent: task.parent, hours: 0, verifiedDate: task.lastVerifiedDate || null });
                    });
                    continue;
                }

                const selectedPlans = selectPlans(activePlans);
                let planHours = {};
                if (selectedPlans.length === 1) {
                    planHours[selectedPlans[0].goal.id] = dayRemTotal;
                } else {
                    const totalWeight = selectedPlans.reduce((sum, p) => sum + p.weight, 0) || 1;
                    selectedPlans.forEach(p => {
                        planHours[p.goal.id] = (dayRemTotal * (p.weight / totalWeight));
                    });
                }

                let carryOver = 0;
                selectedPlans.forEach((plan, planIdx) => {
                    const planBudget = Math.max(0, (planHours[plan.goal.id] || 0) + carryOver);
                    carryOver = 0;
                    const planLeaves = isToday ? plan.leaves.filter(t => t.lastVerifiedDate !== todayStr) : plan.leaves;
                    const topTasks = selectTopPlanTasks(planLeaves);
                    const ratios = topTasks.length === 1 ? [1] : topTasks.length === 2 ? [0.67, 0.33] : [0.5, 0.25, 0.25];
                    let planRem = planBudget;
                    topTasks.forEach((task, idx) => {
                        const ratio = ratios[idx] || 0;
                        let share = planBudget * ratio;
                        if (idx === topTasks.length - 1) {
                            share = planRem;
                        }
                        const work = Math.min(task.remaining, share, planRem);
                        if (work > 0) {
                            schedule.push({ date: dStr, taskId: task.id, title: task.title, parent: task.parent, hours: parseFloat(work.toFixed(1)), verifiedDate: task.lastVerifiedDate || null });
                            task.remaining -= work;
                            planRem -= work;
                        }
                    });
                    if (planRem > 0 && planIdx + 1 < selectedPlans.length) {
                        carryOver = planRem;
                    }
                });
            }
            return schedule;
        }

        function getOffsetDateString(offset) {
            const d = new Date();
            d.setDate(d.getDate() + offset);
            const options = { timeZone: state.timezone, year: 'numeric', month: '2-digit', day: '2-digit' };
            const formatter = new Intl.DateTimeFormat('en-CA', options);
            return formatter.format(d);
        }

        function collectActiveLeaves(node, pName, priority, weight, result) {
            if (node.completed) return;
            if (!node.children || node.children.length === 0) {
                if (node.targetHours > node.doneHours) {
                    // 深拷貝對象以供排程模擬計算
                    result.push({ ...node, parent: pName, priority, weight });
                }
            } else {
                node.children.forEach(c => collectActiveLeaves(c, pName, priority, weight, result));
            }
        }

        function collectGoalLeaves(node, result, depth) {
            if (!node.children || node.children.length === 0) {
                result.push({ ...node, depth });
                return;
            }
            node.children.forEach(c => collectGoalLeaves(c, result, depth + 1));
        }

        function selectPlans(planStates) {
            const highestPriority = Math.max(...planStates.map(p => p.priority));
            const topPlans = planStates.filter(p => p.priority === highestPriority);
            if (topPlans.length <= 2) return topPlans.sort((a, b) => b.weight - a.weight);
            return topPlans.sort((a, b) => b.weight - a.weight).slice(0, 2);
        }

        function selectTopPlanTasks(leaves) {
            const sorted = leaves.slice().sort((a, b) => a.treeIndex - b.treeIndex);
            return sorted.slice(0, 3);
        }

        // --- UI 渲染 ---
        function renderGoalCards() {
            const grid = document.getElementById('goals-grid');
            grid.innerHTML = '';
            state.goals.forEach(g => {
                const stats = getGoalStats(g);
                const progress = stats.target === 0 ? 0 : Math.round((stats.done / stats.target) * 100);
                grid.innerHTML += `
                    <div onclick="openDetails(${g.id})" class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm cursor-pointer hover:shadow-md transition group">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h4 class="font-black text-slate-800 text-lg group-hover:text-indigo-600 transition">${g.title}</h4>
                                <div class="flex gap-2 mt-1.5">
                                    <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">P${g.priority}</span>
                                    <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-400">${g.weight}% 權重</span>
                                </div>
                            </div>
                            <span class="text-sm font-black text-indigo-600">${progress}%</span>
                        </div>
                        <div class="w-full bg-slate-50 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-500 h-full transition-all duration-700 ease-out" style="width: ${progress}%"></div>
                        </div>
                        <div class="mt-4 flex justify-between items-center text-[10px] font-bold text-slate-400">
                            <span>截止: ${g.deadline || '未定'}</span>
                            <span class="text-slate-500">已完成 ${stats.done.toFixed(1)} / ${stats.target.toFixed(1)} h</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderWeeklyPlanner() {
            const container = document.getElementById('weekly-container');
            const sched = calculateSchedule();
            container.innerHTML = '';
            container.className = 'flex flex-col gap-4';

            const tasksByDate = {};
            sched.forEach(s => { if (!tasksByDate[s.date]) tasksByDate[s.date] = []; tasksByDate[s.date].push(s); });

            const todayStr = getTodayString();
            const dayLabels = ['日','一','二','三','四','五','六'];

            for (let i = 0; i < 7; i++) {
                const date = getOffsetDateString(i);
                const tasks = tasksByDate[date] || [];
                const isToday = date === todayStr;
                const isOff = state.offDays.includes(date);
                const d = parseDateString(date);
                const dayName = dayLabels[d.getDay()];

                let html = `
                    <div class="p-4 rounded-3xl border ${isToday ? 'bg-indigo-50/50 border-indigo-100 ring-1 ring-indigo-500/10' : 'bg-white border-slate-100 shadow-sm'}">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <p class="text-xs font-black uppercase tracking-widest ${isToday ? 'text-indigo-600' : 'text-slate-400'}">${dayName} ${date}</p>
                                ${isToday ? '<p class="text-[10px] text-indigo-500 font-bold">• 今天</p>' : ''}
                            </div>
                            <p class="text-[10px] font-bold text-slate-400">${tasks.reduce((sum, t) => sum + t.hours, 0).toFixed(1)}h</p>
                        </div>
                        ${isOff ? '<div class="rounded-2xl bg-slate-50 p-3 text-[10px] text-slate-500 font-bold">休息日</div>' : ''}
                        <div class="space-y-3">
                `;

                if (tasks.length === 0) {
                    html += `
                        <div class="rounded-2xl bg-slate-50 p-3 text-[10px] text-slate-500">尚無排程</div>
                    `;
                } else {
                    tasks.forEach(t => {
                        const isVerified = isToday && t.verifiedDate === date;
                        const isClickable = isToday && !isVerified;
                        const btnClasses = isClickable ? 'w-6 h-6 rounded-lg border-2 border-slate-200 bg-white flex items-center justify-center hover:border-indigo-500 transition-colors' : 'w-6 h-6 rounded-lg border-2 border-slate-200 bg-slate-100 text-slate-400 flex items-center justify-center cursor-not-allowed';
                        const btnProps = isClickable ? `onclick="openLogHours(${t.taskId}, '${t.title}', ${t.hours})"` : 'disabled';

                        html += `
                            <div class="flex items-center justify-between gap-3 p-3 bg-white border border-slate-100 rounded-3xl">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span style="display:${isVerified ? 'block' : 'none'}" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-green-500 text-white">${isVerified ? '已核銷' : ''}</span>
                                    </div>
                                    <p class="text-sm font-bold text-slate-700 truncate">${t.title}</p>
                                    <p class="text-[9px] text-slate-400 truncate">${t.parent}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-black ${t.hours === 0 && isToday ? 'text-red-400' : 'text-slate-500'} tabular-nums">${t.hours}h</span>
                                    <button ${btnProps} class="${btnClasses}">
                                        <div class="w-1.5 h-1.5 rounded-full bg-slate-100"></div>
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        // --- 詳情視窗功能 ---
        function openDetails(id) {
            activeGoalId = id;
            renderDetails(id);
            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function renderDetails(id) {
            const g = state.goals.find(x => x.id === id);
            const stats = getGoalStats(g);
            const progress = stats.target === 0 ? 0 : Math.round((stats.done / stats.target) * 100);

            document.getElementById('detail-title').innerText = g.title;
            document.getElementById('detail-badge').innerText = `P${g.priority} | ${g.weight}% 權重`;

            document.getElementById('detail-stats-grid').innerHTML = `
                <div class="bg-slate-50 p-4 rounded-2xl text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">原始預計總工時</p>
                    <p class="text-xl font-black text-slate-700">${stats.target.toFixed(1)}h</p>
                </div>
                <div class="bg-indigo-50 p-4 rounded-2xl text-center">
                    <p class="text-[10px] font-black text-indigo-400 uppercase mb-1">目前核銷進度</p>
                    <p class="text-xl font-black text-indigo-600">${progress}%</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">剩餘應完成</p>
                    <p class="text-xl font-black text-slate-700">${(stats.target - stats.done).toFixed(1)}h</p>
                </div>
            `;

            document.getElementById('detail-tree-scale').value = detailTreeScale;
            updateDetailTreeScale(detailTreeScale);
            renderDetailTaskTree(g);

            const logsDiv = document.getElementById('detail-logs');
            logsDiv.innerHTML = (g.logs || []).slice().reverse().map(l => `
                <div class="flex gap-3 items-start group">
                    <div class="w-1.5 h-1.5 rounded-full bg-indigo-400 mt-1.5 shrink-0"></div>
                    <div class="flex-1">
                        <p class="text-xs font-bold text-slate-700 leading-relaxed">${l.msg}</p>
                        <p class="text-[9px] text-slate-400 font-medium mt-0.5">${l.time}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('detail-edit-btn').onclick = () => openEditGoal(id);
        }

        // --- 工時核銷功能 (引入 Available Hours 扣除) ---
        function parseDateString(date) {
            const [year, month, day] = date.split('-');
            return new Date(parseInt(year), parseInt(month, 10) - 1, parseInt(day, 10));
        }

        function updateDetailTreeScale(value) {
            detailTreeScale = parseFloat(value) || 1;
            const tree = document.getElementById('detail-task-tree');
            if (tree) tree.style.fontSize = detailTreeScale + 'rem';
        }

        function toggleDetailTreeMode() {
            detailTreeMode = detailTreeMode === 'vertical' ? 'horizontal' : 'vertical';
            const btn = document.getElementById('detail-tree-mode-btn');
            if (btn) btn.innerText = detailTreeMode === 'horizontal' ? '垂直樹' : '水平樹';
            if (activeGoalId) {
                const goal = state.goals.find(g => g.id === activeGoalId);
                if (goal) renderDetailTaskTree(goal);
            }
        }

        function generateHorizontalTreeHTML(nodes) {
            if (!nodes || nodes.length === 0) return '';

            function renderBranch(node) {
                const stats = getGoalStats(node);
                const isLeaf = !node.children || node.children.length === 0;
                const progress = stats.target === 0 ? 0 : Math.round((stats.done / stats.target) * 100);
                const statusTags = [];
                if (node.completed) statusTags.push(`<span class="bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded ml-1">已完成</span>`);
                if (node.isExtended) statusTags.push(`<span class="bg-red-50 text-red-500 px-1.5 py-0.5 rounded ml-1">已延長工時</span>`);
                if (node.isEarly) statusTags.push(`<span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded ml-1">超前 ${node.earlyHours}h</span>`);
                if (node.isOverrun) statusTags.push(`<span class="bg-yellow-50 text-amber-600 px-1.5 py-0.5 rounded ml-1">已超過計畫工時</span>`);
                const card = `
                    <div class="p-4 bg-white rounded-3xl shadow-sm border border-slate-200 ${node.completed ? 'opacity-70' : ''} w-[220px] text-center">
                        <p class="text-sm font-bold ${node.completed ? 'status-completed line-through' : 'text-slate-700'}">${node.title}</p>
                        <div class="flex flex-wrap justify-center items-center gap-2 mt-2 text-[10px] text-slate-500">
                            <span>${stats.done.toFixed(1)} / ${stats.target.toFixed(1)} h</span>
                            <span>${progress}%</span>
                            ${isLeaf ? '<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">末端</span>' : '<span class="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">父節點</span>'}
                            ${statusTags.join('')}
                        </div>
                    </div>
                `;

                if (!node.children || node.children.length === 0) {
                    return `<div class="relative flex flex-col items-center gap-4">${card}</div>`;
                }

                const childrenHTML = node.children.map(child => `
                    <div class="relative flex flex-col items-center gap-4 min-w-[260px]">
                        <div class="absolute top-0 left-1/2 w-0.5 h-8 bg-slate-300 rounded-full"></div>
                        ${renderBranch(child)}
                    </div>
                `).join('');

                return `
                    <div class="relative flex flex-col items-center gap-6 w-full">
                        <div class="relative z-10">${card}</div>
                        <div class="absolute top-0 left-1/2 w-0.5 h-6 bg-slate-300 rounded-full"></div>
                        <div class="absolute top-6 inset-x-0 h-0.5 bg-slate-300"></div>
                        <div class="relative flex justify-center gap-10 w-full pt-10">
                            ${childrenHTML}
                        </div>
                    </div>
                `;
            }

            return `<div class="flex flex-col items-center gap-8 w-full">${nodes.map(renderBranch).join('')}</div>`;
        }

        function renderDetailTaskTree(goal) {
            const container = document.getElementById('detail-task-tree');
            if (!container) return;
            if (detailTreeMode === 'horizontal') {
                container.innerHTML = generateHorizontalTreeHTML(goal.children || []);
            } else {
                container.innerHTML = generateDetailTreeHTML(goal.children || [], 0);
            }
        }

        function generateDetailTreeHTML(nodes, depth) {
            return nodes.map(node => {
                const stats = getGoalStats(node);
                const isLeaf = !node.children || node.children.length === 0;
                const progress = stats.target === 0 ? 0 : Math.round((stats.done / stats.target) * 100);
                const isDone = node.completed;
                let statusTags = '';
                if (node.completed) statusTags += `<span class="bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded ml-1">已完成</span>`;
                if (node.isExtended) statusTags += `<span class="bg-red-50 text-red-500 px-1.5 py-0.5 rounded ml-1">已延長工時</span>`;
                if (node.isEarly) statusTags += `<span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded ml-1">超前 ${node.earlyHours}h</span>`;
                if (node.isOverrun) statusTags += `<span class="bg-yellow-50 text-amber-600 px-1.5 py-0.5 rounded ml-1">已超過計畫工時</span>`;

                return `
                    <div class="pl-${depth * 4} border-l-2 border-slate-100">
                        <div class="p-4 bg-white rounded-3xl shadow-sm ${node.completed ? 'opacity-70' : ''}">
                            <div class="flex items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="text-sm font-bold ${node.completed ? 'status-completed line-through' : 'text-slate-700'}">${node.title}</p>
                                    <div class="flex flex-wrap items-center gap-2 mt-2 text-[10px] text-slate-500">
                                        <span>${stats.done.toFixed(1)} / ${stats.target.toFixed(1)} h</span>
                                        <span>${progress}%</span>
                                        ${isLeaf ? '<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">末端</span>' : '<span class="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">父節點</span>'}
                                        ${statusTags}
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    ${!isDone&&isLeaf ? `
                                        <button onclick="markEarly(${node.id})" class="text-emerald-600 bg-emerald-50 text-[10px] font-bold px-3 py-1.5 rounded-xl hover:bg-emerald-100 transition">超前完成</button>
                                        <button onclick="extendHours(${node.id})" class="text-red-500 bg-red-50 text-[10px] font-bold px-3 py-1.5 rounded-xl hover:bg-red-100 transition">延長工時</button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        ${node.children ? generateDetailTreeHTML(node.children, depth + 1) : ''}
                    </div>
                `;
            }).join('');
        }

        function manualTaskVerification() {
            if (!state.goals || state.goals.length === 0) {
                alert('請先建立計畫後再進行手動核銷。');
                return;
            }
            renderManualGoalOptions();
            document.getElementById('manual-log-modal').classList.remove('hidden');
        }

        function renderManualGoalOptions() {
            const select = document.getElementById('manual-goal-select');
            const availableGoals = state.goals.filter(g => {
                const leaves = [];
                collectIncompleteLeafNodes(g, leaves);
                return leaves.length > 0;
            });

            if (availableGoals.length === 0) {
                select.innerHTML = `<option value="">無可核銷的計畫</option>`;
                select.disabled = true;
                renderManualTaskOptions();
                return;
            }

            select.disabled = false;
            select.innerHTML = availableGoals.map(g => {
                const stats = getGoalStats(g);
                const progress = stats.target === 0 ? 0 : Math.round((stats.done / stats.target) * 100);
                return `<option value="${g.id}">${g.title} (${progress}%)</option>`;
            }).join('');
            select.value = availableGoals[0].id;
            renderManualTaskOptions();
        }

        function renderManualTaskOptions() {
            const goalId = parseInt(document.getElementById('manual-goal-select').value, 10);
            const goal = state.goals.find(g => g.id === goalId);
            const taskSelect = document.getElementById('manual-task-select');
            taskSelect.innerHTML = '';
            if (!goal) {
                taskSelect.innerHTML = `<option value="">尚未選擇計畫</option>`;
                taskSelect.disabled = true;
                return;
            }
            const leaves = [];
            collectIncompleteLeafNodes(goal, leaves);
            if (leaves.length === 0) {
                taskSelect.innerHTML = `<option value="">此計畫暫無可核銷的末端子任務</option>`;
                taskSelect.disabled = true;
                return;
            }
            taskSelect.disabled = false;
            taskSelect.innerHTML = leaves.map(t => `<option value="${t.id}">${t.title} (${t.doneHours.toFixed(1)} / ${t.targetHours.toFixed(1)}h)</option>`).join('');
        }

        function confirmManualVerification() {
            const taskId = parseInt(document.getElementById('manual-task-select').value, 10);
            const hours = parseFloat(document.getElementById('manual-log-hours').value) || 0;
            if (!taskId) {
                alert('請選擇末端子任務。');
                return;
            }
            const task = findNode(taskId);
            const parentGoal = findParentGoal(taskId);
            if (!task || !parentGoal) {
                alert('任務選擇錯誤，請重新選擇。');
                return;
            }

            const remaining = Math.max(0, (task.targetHours || 0) - (task.doneHours || 0));
            if (hours > remaining) {
                const over = parseFloat((hours - remaining).toFixed(1));
                if (!confirm(`本次核銷會超出此任務剩餘計畫工時 ${remaining.toFixed(1)}h，超出 ${over}h，是否繼續？`)) return;
                task.isOverrun = true;
                task.overrunHours = parseFloat(((task.doneHours || 0) + hours - task.targetHours).toFixed(1));
            }

            let logMsg = `手動核銷任務「${task.title}」：`;
            if (hours === 0) {
                logMsg += `今日逾期 (未核銷時數)`;
            } else {
                logMsg += `核銷 ${hours}h`;
            }
            task.doneHours += hours;
            if (task.doneHours >= task.targetHours) {
                task.completed = true;
                logMsg += ' ➔ 任務正式結案';
                const parentNode = findParentNode(taskId);
                if (parentNode) checkAndMarkParentCompleted(parentNode);
            }
            if (task.isOverrun) {
                const overrunAmount = parseFloat((task.doneHours - task.targetHours).toFixed(1));
                logMsg += ` ➔ 超出計畫工時 ${overrunAmount}h`;
            }

            state.todayAvailableHours -= hours;
            task.lastVerifiedDate = getTodayString();
            addLog(parentGoal.id, logMsg);
            closeModals();
            persist();
        }

        function collectLeafNodes(node, result) {
            if (!node.children || node.children.length === 0) {
                result.push(node);
                return;
            }
            node.children.forEach(c => collectLeafNodes(c, result));
        }

        function collectIncompleteLeafNodes(node, result) {
            if (!node.children || node.children.length === 0) {
                const done = node.doneHours || 0;
                const target = node.targetHours || 0;
                if (done < target) result.push(node);
                return;
            }
            node.children.forEach(c => collectIncompleteLeafNodes(c, result));
        }

        function openLogHours(taskId, title, suggested) {
            const task = findNode(taskId);
            const parentGoal = findParentGoal(taskId);
            activeGoalId = parentGoal.id; // 設定 context

            document.getElementById('log-task-title').innerText = `建議核銷: ${suggested}h (來自: ${title})`;
            document.getElementById('log-hours-input').value = suggested;
            document.getElementById('log-modal').classList.remove('hidden');

            document.getElementById('log-confirm-btn').onclick = () => {
                const hours = parseFloat(document.getElementById('log-hours-input').value) || 0;
                const remaining = Math.max(0, (task.targetHours || 0) - (task.doneHours || 0));
                if (hours > remaining) {
                    const over = parseFloat((hours - remaining).toFixed(1));
                    if (!confirm(`本次核銷會超出此任務剩餘計畫工時 ${remaining.toFixed(1)}h，超出 ${over}h，是否繼續？`)) return;
                    task.isOverrun = true;
                    task.overrunHours = parseFloat(((task.doneHours || 0) + hours - task.targetHours).toFixed(1));
                }

                let logMsg = `核銷任務「${task.title}」：`;
                const delta = parseFloat((hours - suggested).toFixed(1));
                
                if (hours === 0) {
                    logMsg += `今日逾期 (未核銷時數)`;
                } else if (hours < suggested) {
                    logMsg += `今日核銷 ${hours}h (少 ${parseFloat((suggested - hours).toFixed(1))}h)`;
                } else if (Math.abs(delta) < 0.05) {
                    logMsg += `今日順利完成 ${hours}h`;
                } else {
                    logMsg += `今日超前核銷 ${hours}h (超出規劃 ${delta}h)`;
                }

                task.doneHours += hours;
                if (task.doneHours >= task.targetHours) {
                    task.completed = true;
                    logMsg += " ➔ 任務正式結案";
                    const parentNode = findParentNode(taskId);
                    if (parentNode) checkAndMarkParentCompleted(parentNode);
                }
                if (task.isOverrun) {
                    const overrunAmount = parseFloat((task.doneHours - task.targetHours).toFixed(1));
                    logMsg += ` ➔ 超出計畫工時 ${overrunAmount}h`;
                }

                state.todayAvailableHours -= hours;
                task.lastVerifiedDate = getTodayString();

                addLog(activeGoalId, logMsg);
                closeModals();
                persist();
            };
        }

        function markEarly(taskId) {
            const task = findNode(taskId);
            const rem = task.targetHours - task.doneHours;
            if (confirm(`確定超前完成「${task.title}」嗎？\n這將節省剩餘的 ${rem.toFixed(1)} 小時。`)) {
                task.isEarly = true;
                task.earlyHours = rem.toFixed(1);
                task.doneHours = task.targetHours;
                task.completed = true;
                addLog(activeGoalId, `超前完成「${task.title}」，縮短工時 ${rem.toFixed(1)}h 並結案`);
                const parentNode = findParentNode(taskId);
                if (parentNode) checkAndMarkParentCompleted(parentNode);
                persist();
            }
        }

        function extendHours(taskId) {
            const add = prompt("此任務需延長多少小時？", "1");
            if (add && !isNaN(add)) {
                const task = findNode(taskId);
                const val = parseFloat(add);
                task.targetHours += val;
                task.isExtended = true;
                addLog(activeGoalId, `延長任務「${task.title}」工時：增加 ${val}h`);
                persist();
            }
        }

        // --- 編輯功能 ---
        function createNewGoal() {
            const id = ++state.lastId;
            state.goals.push({
                id, title: "新計畫", priority: 5, weight: 20,
                deadline: new Date(Date.now() + 86400000*30).toISOString().split('T')[0],
                targetHours: 0, doneHours: 0, completed: false, children: [], logs: []
            });
            openEditGoal(id, true);
        }

        function openEditGoal(id, isNew = false) {
            activeGoalId = id;
            isNewGoalEdit = isNew;
            const g = state.goals.find(x => x.id === id);
            document.getElementById('edit-goal-title').value = g.title;
            document.getElementById('edit-goal-priority').value = g.priority;
            document.getElementById('edit-goal-weight').value = g.weight;
            document.getElementById('edit-goal-deadline').value = g.deadline;
            renderTree();
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function renderTree() {
            const goal = state.goals.find(g => g.id === activeGoalId);
            const container = document.getElementById('tree-root');
            if (!goal) return;
            container.innerHTML = generateTreeHTML(goal.children || [], 0);
        }

        function generateTreeHTML(nodes, depth) {
            return nodes.map(node => {
                const isLeaf = !node.children || node.children.length === 0;
                const showAdd = isNewGoalEdit || node.isLive || (node.children && node.children.length > 0);
                const editableHours = isNewGoalEdit || node.isLive;
                return `
                <div class="ml-${depth * 4} border-l-2 border-slate-100 pl-4 py-2 my-1">
                    <div class="flex items-center gap-2 group">
                        <input type="text" value="${node.title}" onchange="updateNodeTitle(${node.id}, this.value)" class="flex-1 bg-transparent text-sm font-medium outline-none border-b border-transparent focus:border-indigo-300">
                        ${isLeaf ? (editableHours ? `<input type="number" value="${node.targetHours || 0}" onchange="updateNodeHours(${node.id}, this.value)" class="w-12 text-[10px] text-slate-500 font-bold bg-slate-50 px-2 py-1 rounded-lg outline-none focus:bg-white focus:ring-1 ring-indigo-300" step="0.5">` : `<span class="text-[10px] text-slate-500 font-bold bg-slate-50 px-2 py-1 rounded-lg">${node.targetHours || 0}h</span>`) : ''}
                        ${showAdd ? `<button onclick="addChildNode(${node.id})" class="text-slate-300 hover:text-indigo-500 text-lg font-bold px-1">+</button>` : ''}
                        <button onclick="deleteNode(${node.id})" class="text-slate-300 hover:text-red-500 text-lg font-bold px-1">×</button>
                    </div>
                    ${node.children ? generateTreeHTML(node.children, depth + 1) : ''}
                </div>
            `;
            }).join('');
        }

        function addRootTask() {
            const g = state.goals.find(x => x.id === activeGoalId);
            if (!g) return;
            const id = ++state.lastId;
            g.children.push({
                id, title: "新子任務", targetHours: 1, doneHours: 0,
                completed: false, children: [], isExtended: false, isEarly: false, earlyHours: 0, isLive: true
            });
            renderTree();
        }

        function updateNodeTitle(id, val) { const n = findNode(id); if (n) n.title = val; }

        function updateNodeHours(id, val) { const n = findNode(id); if (n) n.targetHours = parseFloat(val) || 0; }

        function addChildNode(parentId) {
            const parent = findNode(parentId);
            if (parent) {
                const id = ++state.lastId;
                parent.children.push({
                    id, title: "新子任務", targetHours: 1, doneHours: 0,
                    completed: false, children: [], isExtended: false, isEarly: false, earlyHours: 0, isLive: true
                });
                renderTree();
            }
        }

        function deleteNode(id) {
            let deletedTitle = null;
            const remove = (list) => {
                const idx = list.findIndex(n => n.id === id);
                if (idx > -1) {
                    deletedTitle = list[idx].title;
                    list.splice(idx, 1);
                    return true;
                }
                for (let n of list) if (n.children && remove(n.children)) return true;
                return false;
            };
            remove(state.goals);
            if (deletedTitle) addLog(activeGoalId, `刪除子任務「${deletedTitle}」`);
            renderTree();
        }

        function saveActiveGoal() {
            const g = state.goals.find(x => x.id === activeGoalId);
            g.title = document.getElementById('edit-goal-title').value;
            let priority = parseInt(document.getElementById('edit-goal-priority').value);
            if (isNaN(priority)) priority = 1;
            g.priority = Math.min(5, Math.max(1, priority));
            g.weight = parseInt(document.getElementById('edit-goal-weight').value);
            g.deadline = document.getElementById('edit-goal-deadline').value;
            const createdNodes = [];
            collectLiveNodes(g, createdNodes);
            createdNodes.forEach(node => {
                if (node.children && node.children.length > 0) {
                    addLog(activeGoalId, `新增結點「${node.title}」`);
                } else {
                    addLog(activeGoalId, `新增子任務「${node.title}」，原始預計 ${node.targetHours || 0}h`);
                }
            });
            markAllNodesDead(g);
            isNewGoalEdit = false;
            closeModals();
            persist();
        }

        function collectLiveNodes(node, result) {
            if (!node) return;
            if (node.isLive) result.push(node);
            if (node.children) node.children.forEach(c => collectLiveNodes(c, result));
        }

        function markAllNodesDead(node) {
            if (!node) return;
            node.isLive = false;
            if (node.children) node.children.forEach(markAllNodesDead);
        }

        // --- 核心工具 ---
        function getGoalStats(node) {
            if (!node.children || node.children.length === 0) {
                // 葉子節點，使用自己的時間
                return { target: node.targetHours || 0, done: Math.min(node.doneHours || 0, node.targetHours || 0) };
            } else {
                // 父節點，只累加子節點的統計，忽略自己的 targetHours 和 doneHours
                let target = 0;
                let done = 0;
                node.children.forEach(c => {
                    const s = getGoalStats(c);
                    target += s.target;
                    done += s.done;
                });
                return { target, done };
            }
        }

        function getAllLeaves(node, result) {
            if (!node.children || node.children.length === 0) {
                if (node.id !== activeGoalId) result.push(node);
            } else {
                node.children.forEach(c => getAllLeaves(c, result));
            }
        }

        function findNode(id, nodes = state.goals) {
            for (let n of nodes) {
                if (n.id === id) return n;
                if (n.children) { const r = findNode(id, n.children); if (r) return r; }
            }
            return null;
        }

        function findParentGoal(id) {
            for (let g of state.goals) { if (findNode(id, [g])) return g; }
            return null;
        }

        function findParentNode(id) {
            for (let g of state.goals) {
                const result = findParentNodeInTree(id, g.children);
                if (result) return result;
            }
            return null;
        }

        function findParentNodeInTree(id, nodes) {
            for (let n of nodes) {
                if (n.children) {
                    if (n.children.some(c => c.id === id)) return n;
                    const result = findParentNodeInTree(id, n.children);
                    if (result) return result;
                }
            }
            return null;
        }

        function checkAndMarkParentCompleted(node) {
            if (!node || !node.children || node.children.length === 0) return;
            const allCompleted = node.children.every(c => c.completed);
            if (allCompleted && !node.completed) {
                node.completed = true;
                const parent = findParentNode(node.id);
                if (parent) checkAndMarkParentCompleted(parent);
            }
        }

        function addLog(goalId, msg) {
            const g = state.goals.find(x => x.id === goalId);
            if (!g) return;
            if (!g.logs) g.logs = [];
            g.logs.push({ 
                time: new Date().toLocaleString('zh-TW', { timeZone: state.timezone }), 
                msg 
            });
        }

        function deleteActiveGoal() {
            if (confirm("確定刪除此計畫及其所有紀錄？")) {
                state.goals = state.goals.filter(x => x.id !== activeGoalId);
                closeModals();
                persist();
            }
        }

        function closeModals() {
            document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden'));
            document.body.style.overflow = 'auto';
        }

        function removeOffDay(date) {
            state.offDays = state.offDays.filter(d => d !== date);
            renderOffDayTags();
        }

        function addOffDay() {
            const date = document.getElementById('cfg-off-date').value;
            if (date && !state.offDays.includes(date)) {
                state.offDays.push(date);
                renderOffDayTags();
            }
        }

        function renderOffDayTags() {
            const container = document.getElementById('off-days-tags');
            container.innerHTML = state.offDays.sort().map(d => `
                <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-600 text-[10px] font-bold px-3 py-1.5 rounded-full border border-slate-200">
                    ${d} <button onclick="removeOffDay('${d}')" class="text-slate-400 hover:text-slate-600">×</button>
                </span>
            `).join('');
        }

        function saveConfig() {
            const oldMax = state.dailyMaxHours;// 儲存前的每日上限
            const newMax = parseFloat(document.getElementById('cfg-daily-hours').value) || 4;// 新的每日上限，預設為 4 小時
            
            

            // 如果調大了每日總額，同步補貼今日餘額
            if (newMax !== oldMax) {
                const diff = newMax - oldMax;
                state.todayAvailableHours += diff;
                state.dailyMaxHours = newMax;
            }

            state.timezone = document.getElementById('cfg-timezone').value;
            persist();
            updateDateDisplay();
            closeModals();
        }

        function openConfig() { document.getElementById('config-modal').classList.remove('hidden'); }
    </script>
</body>
</html>
