<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>核心規劃器 V6 - Google 雲端整合</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #f1f5f9; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.05), 0 8px 10px -6px rgba(79, 70, 229, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-tag { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; }
        .log-line { position: relative; padding-left: 20px; }
        .log-line::before { content: ''; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #6366f1; }
        .log-line::after { content: ''; position: absolute; left: 3px; top: 20px; width: 2px; height: calc(100% - 10px); background: #f1f5f9; }
        .log-line:last-child::after { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <!-- 頂部導覽列：OAuth 狀態 -->
    <nav class="sticky top-0 z-50 glass-nav px-4 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
            <span id="sync-status" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">本地儲存模式</span>
        </div>
        <div id="auth-actions">
            <button id="login-btn" onclick="handleAuthClick()" class="flex items-center gap-2 bg-white border border-slate-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-50 transition active:scale-95">
                <svg class="w-3 h-3" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                同步 Google 日曆
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- 標題 -->
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-slate-900">任務核心規劃器 <span class="text-indigo-600 italic">V6</span></h1>
                <p id="today-display" class="text-sm font-bold text-slate-400 mt-1 uppercase tracking-widest"></p>
            </div>
            <button onclick="createNewGoal()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl shadow-xl shadow-indigo-100 font-bold text-sm hover:scale-105 transition-all active:scale-95">新增目標</button>
        </header>

        <!-- 本週排程 -->
        <section class="mb-12">
            <h2 class="text-lg font-black mb-5 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span>
                今日與本週排程建議
            </h2>
            <div id="weekly-container" class="grid gap-4"></div>
        </section>

        <!-- 目標列表 -->
        <section>
            <h2 class="text-lg font-black mb-5 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-emerald-400 rounded-full"></span>
                長期目標進度
            </h2>
            <div id="goals-grid" class="grid gap-4 sm:grid-cols-2"></div>
        </section>
    </main>

    <!-- 詳情 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 hidden z-50 flex items-center justify-center p-0 md:p-4">
        <div class="bg-white w-full h-full md:h-auto md:max-h-[90vh] md:max-w-3xl md:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="px-6 py-5 border-b flex justify-between items-center sticky top-0 bg-white">
                <div>
                    <h3 id="detail-title" class="text-xl font-black text-slate-900">計畫詳情</h3>
                    <div id="detail-meta" class="flex gap-2 mt-1"></div>
                </div>
                <button onclick="closeModals()" class="text-slate-300 text-4xl leading-none hover:text-slate-500">&times;</button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-8 custom-scrollbar">
                <div id="detail-stats" class="grid grid-cols-3 gap-4"></div>
                <div>
                    <h4 class="font-black text-slate-800 mb-4 flex justify-between">
                        任務組成
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">時數已鎖定</span>
                    </h4>
                    <div id="detail-tasks-list" class="space-y-3"></div>
                </div>
                <div class="border-t pt-8">
                    <h4 class="font-black text-slate-800 mb-6 italic">操作日誌與進度追蹤 (Timeline)</h4>
                    <div id="detail-logs" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 核銷 Modal -->
    <div id="log-modal" class="fixed inset-0 bg-slate-900/60 hidden z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl">
            <h3 class="text-xl font-black text-center mb-2">工時核銷</h3>
            <p id="log-context" class="text-xs text-center text-slate-400 font-bold mb-8 uppercase tracking-tighter"></p>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block text-center mb-2">投入時數 (h)</label>
                    <input type="number" id="log-input" step="0.5" class="w-full text-center text-5xl font-black border-b-4 border-indigo-50 py-4 outline-none focus:border-indigo-500 transition-colors">
                </div>
                <button id="log-confirm-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 active:scale-95 transition">確認提交</button>
                <button onclick="closeModals()" class="w-full text-slate-400 text-sm font-bold">取消</button>
            </div>
        </div>
    </div>

    <!-- SDKs -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://apis.google.com/js/api.js"></script>

    <script>
        // --- 設定 (請填入你的 Client ID) ---
        const CLIENT_ID = '687028778487-dmauf1pac18283b565fvfgg1au3kjc21.apps.googleusercontent.com'; 
        const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';

        let tokenClient;
        let gapiInited = false;
        let state = { goals: [], dailyMaxHours: 6, lastId: 0 };
        let activeGoalId = null;

        // --- 初始化 ---
        window.onload = () => {
            const saved = localStorage.getItem('task_planner_v6_full');
            if (saved) state = JSON.parse(saved);
            
            document.getElementById('today-display').innerText = new Date().toLocaleDateString('zh-TW', { dateStyle: 'full' });
            
            initOAuth();
            refreshUI();
        };

        function initOAuth() {
            if (!CLIENT_ID) return;
            gapi.load('client', async () => {
                await gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] });
                gapiInited = true;
            });
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (resp) => { if (resp.access_token) onAuthSuccess(); }
            });
        }

        function handleAuthClick() {
            if (!CLIENT_ID) return alert("請先填入 Client ID");
            if (window.location.protocol === 'file:') return alert("Google 不支援 file:// 開啟，請上傳至 GitHub Pages。");
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        function onAuthSuccess() {
            document.getElementById('sync-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
            document.getElementById('sync-status').innerText = "已連結 Google 日曆";
            document.getElementById('sync-status').classList.replace('text-slate-400', 'text-emerald-600');
            document.getElementById('login-btn').classList.add('hidden');
        }

        // --- 核心業務邏輯 ---
        function persist() {
            localStorage.setItem('task_planner_v6_full', JSON.stringify(state));
            refreshUI();
        }

        function refreshUI() {
            renderGoalCards();
            renderWeeklyPlanner();
        }

        function renderGoalCards() {
            const grid = document.getElementById('goals-grid');
            grid.innerHTML = '';
            state.goals.forEach(g => {
                const s = getStats(g);
                const progress = s.target === 0 ? 0 : Math.round((s.done / s.target) * 100);
                grid.innerHTML += `
                    <div onclick="openDetails(${g.id})" class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer">
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="font-black text-slate-800 leading-tight">${g.title}</h4>
                            <span class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">P${g.priority}</span>
                        </div>
                        <div class="w-full bg-slate-50 h-2 rounded-full overflow-hidden mb-3">
                            <div class="bg-indigo-500 h-full transition-all duration-700" style="width: ${progress}%"></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                            <span>已達成 ${progress}%</span>
                            <span>${s.done.toFixed(1)} / ${s.target.toFixed(1)} h</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderWeeklyPlanner() {
            const container = document.getElementById('weekly-container');
            const schedule = calculateSchedule();
            container.innerHTML = '';

            const groups = {};
            schedule.forEach(s => { if(!groups[s.date]) groups[s.date] = []; groups[s.date].push(s); });
            
            Object.keys(groups).sort().forEach(date => {
                const isToday = date === new Date().toISOString().split('T')[0];
                let html = `
                    <div class="p-6 rounded-[2rem] border ${isToday ? 'bg-indigo-50/40 border-indigo-100' : 'bg-white border-slate-100 shadow-sm'}">
                        <p class="text-[10px] font-black text-slate-400 mb-4 uppercase tracking-[0.2em]">${date} ${isToday ? '• TODAY' : ''}</p>
                        <div class="space-y-4">`;
                groups[date].forEach(t => {
                    html += `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <button onclick="openLogModal(${t.taskId}, '${t.title}', ${t.hours})" class="w-6 h-6 rounded-lg border-2 border-slate-200 bg-white hover:border-indigo-500 transition active:scale-90"></button>
                                <span class="text-sm font-bold text-slate-700">${t.title}</span>
                            </div>
                            <span class="text-xs font-black text-slate-400 tabular-nums">${t.hours}h</span>
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });

            if (schedule.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-slate-300 font-bold italic border-2 border-dashed border-slate-100 rounded-[2rem]">目前沒有待辦任務，請新增目標或子任務。</div>`;
            }
        }

        function calculateSchedule() {
            const today = new Date(); today.setHours(0,0,0,0);
            let pool = [];
            // 複製一份深拷貝來模擬排程
            const tempGoals = JSON.parse(JSON.stringify(state.goals));
            tempGoals.forEach(g => collectLeaves(g, g.priority, pool));
            
            const result = [];
            let cursor = new Date(today);
            for (let i = 0; i < 7; i++) {
                const dStr = cursor.toISOString().split('T')[0];
                let dayCap = state.dailyMaxHours;
                
                // 按優先級與權重分配
                const active = pool.filter(t => (t.targetHours - t.doneHours) > 0);
                if (active.length === 0) break;

                const maxP = Math.max(...active.map(t => t.priority));
                const topP = active.filter(t => t.priority === maxP);
                
                topP.forEach(task => {
                    let needed = task.targetHours - task.doneHours;
                    let allocated = Math.min(needed, dayCap / topP.length, dayCap);
                    if (allocated > 0) {
                        result.push({ date: dStr, taskId: task.id, title: task.title, hours: parseFloat(allocated.toFixed(1)) });
                        task.doneHours += allocated;
                        dayCap -= allocated;
                    }
                });
                cursor.setDate(cursor.getDate() + 1);
            }
            return result;
        }

        function collectLeaves(node, priority, result) {
            if (node.completed) return;
            if (!node.children || node.children.length === 0) {
                result.push({ ...node, priority });
            } else {
                node.children.forEach(c => collectLeaves(c, priority, result));
            }
        }

        // --- 核銷邏輯 (A/B/C/D 狀態) ---
        function openLogModal(taskId, title, planned) {
            const task = findNode(taskId);
            activeGoalId = findParentGoal(taskId).id;
            document.getElementById('log-context').innerText = `${title} | 計畫投入: ${planned}h`;
            document.getElementById('log-input').value = planned;
            document.getElementById('log-modal').classList.remove('hidden');
            
            document.getElementById('log-confirm-btn').onclick = () => {
                const actual = parseFloat(document.getElementById('log-input').value) || 0;
                let logMsg = "";
                
                // 狀態判定
                if (actual === 0) logMsg = `【逾期】今日未投入時間 (原定 ${planned}h)`;
                else if (actual < planned) logMsg = `【進度落後】投入 ${actual}h (少於規劃 ${planned}h)`;
                else if (actual === planned) logMsg = `【準時完成】準時投入 ${actual}h`;
                else logMsg = `【超前達成】超額投入 ${actual}h (原定 ${planned}h)`;

                task.doneHours += actual;
                if (task.doneHours >= task.targetHours) {
                    task.doneHours = task.targetHours;
                    task.completed = true;
                }
                
                addLog(activeGoalId, logMsg);
                closeModals();
                persist();
            };
        }

        // --- 詳情與操作 ---
        function openDetails(id) {
            activeGoalId = id;
            const g = state.goals.find(x => x.id === id);
            const s = getStats(g);
            const progress = s.target === 0 ? 0 : Math.round((s.done / s.target) * 100);

            document.getElementById('detail-title').innerText = g.title;
            document.getElementById('detail-meta').innerHTML = `
                <span class="status-tag bg-indigo-50 text-indigo-600">P${g.priority}</span>
                <span class="status-tag bg-slate-100 text-slate-400">權重 ${g.weight}%</span>
            `;

            document.getElementById('detail-stats').innerHTML = `
                <div class="bg-slate-50 p-4 rounded-2xl text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">總預算</p>
                    <p class="text-lg font-black text-slate-700">${s.target.toFixed(1)}h</p>
                </div>
                <div class="bg-indigo-50 p-4 rounded-2xl text-center border border-indigo-100">
                    <p class="text-[9px] font-black text-indigo-400 uppercase mb-1">已核銷</p>
                    <p class="text-lg font-black text-indigo-600">${s.done.toFixed(1)}h</p>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">完成率</p>
                    <p class="text-lg font-black text-slate-700">${progress}%</p>
                </div>
            `;

            const list = document.getElementById('detail-tasks-list');
            list.innerHTML = '';
            const leaves = [];
            getAllLeaves(g, leaves);
            leaves.forEach(t => {
                const isDone = t.completed;
                list.innerHTML += `
                    <div class="p-4 rounded-2xl border border-slate-100 flex items-center justify-between ${isDone ? 'bg-slate-50 opacity-60' : 'bg-white shadow-sm'}">
                        <div>
                            <h5 class="text-sm font-bold ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}">${t.title}</h5>
                            <div class="flex items-center gap-2 mt-1.5">
                                <span class="text-[10px] font-black text-slate-400">${t.doneHours.toFixed(1)} / ${t.targetHours.toFixed(1)} h</span>
                                ${t.isEarly ? '<span class="status-tag bg-emerald-50 text-emerald-600">✨ 超前結案</span>' : ''}
                                ${t.isExtended ? '<span class="status-tag bg-red-50 text-red-500">⚠️ 已延長</span>' : ''}
                            </div>
                        </div>
                        ${!isDone ? `
                            <div class="flex gap-1">
                                <button onclick="markEarly(${t.id})" class="p-2 hover:bg-emerald-50 rounded-lg text-emerald-500 transition" title="超前完成">✨</button>
                                <button onclick="extendHours(${t.id})" class="p-2 hover:bg-red-50 rounded-lg text-red-400 transition" title="延長工時">➕</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            const logs = document.getElementById('detail-logs');
            logs.innerHTML = (g.logs || []).slice().reverse().map(l => `
                <div class="log-line pb-6">
                    <p class="text-[13px] font-bold text-slate-700 leading-snug">${l.msg}</p>
                    <time class="text-[9px] text-slate-400 font-bold mt-1 block uppercase">${l.time}</time>
                </div>
            `).join('');

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        // --- 輔助功能 ---
        function markEarly(id) {
            const t = findNode(id);
            const saved = (t.targetHours - t.doneHours).toFixed(1);
            if(confirm(`確定超前完成「${t.title}」？這將標註節省了 ${saved}h。`)) {
                t.isEarly = true;
                t.doneHours = t.targetHours;
                t.completed = true;
                addLog(activeGoalId, `【超前結案】手動完成「${t.title}」，標註節省 ${saved}h`);
                persist();
                openDetails(activeGoalId);
            }
        }

        function extendHours(id) {
            const add = prompt("欲增加多少額外工時？", "1");
            if (add && !isNaN(add)) {
                const t = findNode(id);
                t.targetHours += parseFloat(add);
                t.isExtended = true;
                addLog(activeGoalId, `【工時延長】因故增加「${t.title}」時數共 ${add}h`);
                persist();
                openDetails(activeGoalId);
            }
        }

        function createNewGoal() {
            const title = prompt("請輸入新目標名稱", "新計畫");
            if (!title) return;
            const id = ++state.lastId;
            state.goals.push({
                id, title, priority: 5, weight: 20, 
                targetHours: 0, doneHours: 0, 
                completed: false, children: [
                    { id: ++state.lastId, title: "初始任務", targetHours: 5, doneHours: 0, completed: false }
                ],
                logs: [{ time: new Date().toLocaleString(), msg: "🎯 建立了新的目標計畫" }]
            });
            persist();
        }

        function addLog(goalId, msg) {
            const g = state.goals.find(x => x.id === goalId);
            if(!g.logs) g.logs = [];
            g.logs.push({ time: new Date().toLocaleString(), msg });
        }

        function findNode(id, nodes = state.goals) {
            for (let n of nodes) { if (n.id === id) return n; if (n.children) { const r = findNode(id, n.children); if (r) return r; } }
            return null;
        }

        function findParentGoal(id) { for (let g of state.goals) { if (findNode(id, [g])) return g; } return null; }

        function getStats(node) {
            let target = node.targetHours || 0; let done = node.doneHours || 0;
            if (node.children) { node.children.forEach(c => { const s = getStats(c); target += s.target; done += s.done; }); }
            return { target, done };
        }

        function getAllLeaves(node, res) {
            if (!node.children || node.children.length === 0) { if(node.id !== activeGoalId) res.push(node); }
            else { node.children.forEach(c => getAllLeaves(c, res)); }
        }

        function closeModals() {
            document.querySelectorAll('[id$="-modal"]').forEach(m => m.classList.add('hidden'));
        }
    </script>
</body>
</html>
